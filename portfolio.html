<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta name="description" content="Zach Mohr - Product Design & Engineering Portfolio">
    <title>Portfolio - Zach Mohr</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/dithering.css">
    <style>
        .pdf-viewer { margin-top: var(--space-lg); }
        .pdf-page {
            display: block;
            margin: 0 auto var(--space-sm);
            max-width: 100%;
            border: var(--border-width) solid var(--color-gray-200);
            background: var(--color-white);
        }
        .pdf-loading {
            text-align: center;
            padding: var(--space-xl) 0;
            color: var(--color-gray-700);
            font-family: var(--font-body);
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">ZM</a>
            <ul class="nav-menu">
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="/projects" class="nav-link">Projects</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="contact-simple">
        <div class="container">
            <h1 class="page-title">Portfolio</h1>
            <p class="contact-simple-text">A selection of product design and engineering work including prototyping, CAD, and concept development.</p>
            <div class="contact-simple-actions" style="margin-top: var(--space-md);">
                <a href="Zach_Mohr_Portfolio.pdf" target="_blank" class="btn btn-primary">Download Portfolio (PDF)</a>
            </div>
            <div class="pdf-viewer" id="pdfViewer">
                <p class="pdf-loading">Loading portfolio&hellip;</p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p class="footer-text">&copy; 2026 Zach Mohr. Built with precision and a bit of retro flair.</p>
                <div class="footer-links">
                    <a href="mailto:zmohr026@gmail.com" class="footer-link">Email</a>
                    <a href="tel:+16059997649" class="footer-link">Phone</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script type="module">
        import { GlobalWorkerOptions, getDocument } from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
        GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

        var container = document.getElementById('pdfViewer');
        var pdfUrl = 'Zach_Mohr_Portfolio.pdf';
        var scale = 2;

        getDocument(pdfUrl).promise.then(function (pdf) {
            container.innerHTML = '';
            var renderChain = Promise.resolve();
            for (var i = 1; i <= pdf.numPages; i++) {
                (function (pageNum) {
                    renderChain = renderChain.then(function () {
                        return pdf.getPage(pageNum).then(function (page) {
                            var viewport = page.getViewport({ scale: scale });
                            var canvas = document.createElement('canvas');
                            canvas.className = 'pdf-page';
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            container.appendChild(canvas);
                            return page.render({
                                canvasContext: canvas.getContext('2d'),
                                viewport: viewport
                            }).promise;
                        });
                    });
                })(i);
            }
        }).catch(function (err) {
            container.innerHTML = '<p class="pdf-loading">Could not load PDF. <a href="' + pdfUrl + '" target="_blank" style="color: var(--color-red);">Download it directly</a>.</p>';
        });
    </script>
</body>
</html>
